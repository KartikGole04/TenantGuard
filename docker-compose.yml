version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenantguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-tenantguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - tenantguard

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - tenantguard

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_PORT: 8080
      REDIS_URL: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tenantguard

  predictor:
    build:
      context: ./predictor
      dockerfile: Dockerfile
    environment:
      PREDICTOR_PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - tenantguard

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - tenantguard

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - tenantguard

  grafana:
    image: grafana/grafana:latest
    ports:
      - "9091:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - tenantguard

volumes:
  postgres_data:

networks:
  tenantguard:
    driver: bridge
